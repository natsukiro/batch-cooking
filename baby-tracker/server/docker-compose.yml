# Serveur de synchronisation de Petit Rythme.
#
#   Sur le réseau local seulement (http) :   docker compose up -d
#   Sur Internet avec HTTPS automatique :    DOMAIN=bebe.example.fr docker compose --profile https up -d
#
services:
  sync:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Optionnel : exiger ce jeton pour créer un espace famille (voir README).
      PR_CREATE_TOKEN: ${PR_CREATE_TOKEN:-}
    volumes:
      - ./data:/data

  # HTTPS automatique (Let's Encrypt) : le nom de domaine doit pointer vers ce serveur
  # et les ports 80/443 doivent être ouverts.
  caddy:
    image: caddy:2.10-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Indiquez DOMAIN=votre.domaine}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
    depends_on:
      - sync
